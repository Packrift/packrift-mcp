name: MCP live smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: mcp-live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Directory surface lint (local build)
        run: npm run check:directory-surface

      - name: Smoke test box handoff
        run: npm run smoke:cart-handoff -- --sku 1066 --qty 1

      - name: Smoke test label handoff
        run: npm run smoke:cart-handoff -- --sku LL251WR --qty 1

      - name: Directory surface parity (live server)
        run: npm run check:directory-surface:live

      # The capture reports require authentication. Check the anonymous response.
      - name: Check internal capture report access
        continue-on-error: true
        run: |
          for extension in json md; do
            url="https://mcp.packrift.com/ai/all-agent-capture.${extension}"
            status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$url")"
            if [[ "$status" != 404 ]]; then
              echo "::error::Expected HTTP 404 for anonymous access to $url (received $status)"
              exit 1
            fi
            echo "Anonymous access to $url returned HTTP $status"
          done

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-cart-handoff-smoke
          path: outputs/mcp-cart-handoff-smoke/
          if-no-files-found: ignore
