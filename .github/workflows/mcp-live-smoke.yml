name: MCP live smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: mcp-live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test box handoff
        run: npm run smoke:cart-handoff -- --sku 1066 --qty 1

      - name: Smoke test label handoff
        run: npm run smoke:cart-handoff -- --sku LL251WR --qty 1

      - name: Check all-agent capture hub
        run: npm run check:agent-capture

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-cart-handoff-smoke
          path: outputs/mcp-cart-handoff-smoke/
          if-no-files-found: ignore

      - name: Upload agent capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-capture-check
          path: outputs/agent-capture-check/
          if-no-files-found: ignore
